[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jmbayes"
version = "0.8.0"
description = "Bayesian joint models for longitudinal and time-to-event data: a Python/PyTorch implementation of JMbayes2 (CPU or GPU)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "M. Assaf", email = "mormoassaf@gmail.com" }]
keywords = ["joint models", "survival analysis", "longitudinal data", "Bayesian", "MCMC",
            "JMbayes2", "PyTorch", "GPU", "biostatistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "scipy", "pandas", "statsmodels", "torch"]

[project.urls]
Homepage = "https://github.com/neuratomic/jmbayes"
Repository = "https://github.com/neuratomic/jmbayes"
Issues = "https://github.com/neuratomic/jmbayes/issues"
"JMbayes2 (R)" = "https://github.com/drizopoulos/JMbayes2"

[project.optional-dependencies]
dev = ["pytest", "pyreadr", "matplotlib", "reportlab", "psutil", "pypdfium2"]

[tool.setuptools]
packages = ["jmbayes", "jmbayes.datasets"]

[tool.setuptools.package-data]
"jmbayes.datasets" = ["*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
